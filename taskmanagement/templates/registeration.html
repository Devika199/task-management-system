<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
       

        body{
            background:#f8f9fa;
        }

        .navbar{
            background:white;
            box-shadow:0 3px 10px rgba(0,0,0,.08);
        }

      
      
    </style>

</head>
<body>


<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">

<a class="navbar-brand" href="#">Task Management</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">




<li class="nav-item ms-2">
<a href="{% url 'login_page' %}" class="btn btn-success">Login</a>
<a href="{% url 'registeration' %}" class="btn btn-success">Registeration</a>
<a href="{% url 'home' %}" class="btn btn-success">Home</a>

</li>

</ul>

</div>

</div>
</nav>
    
<div class="card" id="">
    <div class="card-header  text-black" >
        <i class="fas fa-user-tie me-2"></i> Registeration
    </div>

    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <label class="form-label"> Name</label>
                <input type="text" class="form-control" id="name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Address</label>
                <input type="textarea" class="form-control" id="add">
            </div>
             <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="email" class="form-control" id="phone" >

                
                
            </div>
             <div class="col-md-6">
                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" >

               
            </div>
             <div class="col-md-6">
                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" >

               
            </div>
            <div class="col-md-12 text-center mt-3">
                              <button type="button" style="background-color: black;"
                                 class="btn btn-lg px-5 text-light" onclick="savelogin()">
Submit                                </button>
                            </div>
        </div>
    </div>
</div>
</body>
<script>
      
function savelogin(){

           var name= $('#name').val();
           var address= $('#add').val();  
           var phone= $('#phone').val();     
           var email= $('#email').val();  
           var password=$('#password').val()     
            $.ajax({
                type: 'POST',
                url: "{% url 'user_save' %}",
                data: {
               'name': name,
                    'address': address,
                    'phone': phone,
                    'email':email,
                    'password':password,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                
                success: function(r) {
                    alert(r.message)
                      if (r.success){
                        
                        location.reload()
                    
                      }
                }
            });
          }

</script>
</html>
