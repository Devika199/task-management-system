<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
       

        body{
            background:#f8f9fa;
        }

        .navbar{
            background:white;
            box-shadow:0 3px 10px rgba(0,0,0,.08);
        }

      
      
    </style>

</head>
<body>

 

<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">

<a class="navbar-brand" href="#">Task Management</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">




<li class="nav-item ms-2">
<a href="{% url 'login_page' %}" class="btn btn-success">Login</a>
<a href="{% url 'registeration' %}" class="btn btn-success">Registeration</a>
<a href="{% url 'home' %}" class="btn btn-success">Home</a>

</li>

</ul>

</div>

</div>
</nav>
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" >
            {{ message }}
            
        </div>
    {% endfor %}
{% endif %}

     <div class="container">
        <form method="POST" action="{% url 'login_fun' %}">
    {% csrf_token %}
    

        <h2 class="text-center  mt-3">Sign In </h2>

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-6">

                <div class="card shadow p-4">


                        <div class="row">

                            <div class="col-md-12">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" placeholder="Enter your email" name="username">
                            </div>
                        </div>
                         <div class="row mt-3">
                            <div class="col-md-12">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter your password" name="password">
                            </div>
                            </div>

                            

                            <div class="col-md-12 text-center mt-3">
                                <button type="submit"
                                 class="btn btn-success btn-lg px-5" >
Login                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

 
       </div>

    </div>
</body>
</html>
