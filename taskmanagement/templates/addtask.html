<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
       

        body{
            background:#f8f9fa;
        }

        .navbar{
            background:white;
            box-shadow:0 3px 10px rgba(0,0,0,.08);
        }

      
      
    </style>

</head>
<body>


<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">

<a class="navbar-brand" href="#">Task Management</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">




<li class="nav-item ms-2">
<a href="{% url 'addtask' %}" class="btn btn-success">Add Task</a>
<a href="{% url 'viewtask' %}" class="btn btn-success">View Task</a>
<a href="{% url 'log_out' %}" class="btn btn-success">Logout</a>

</li>


</ul>

</div>

</div>
</nav>
<div class="card shadow-sm mb-4 mt-4" id="">
    <div class="card-header  text-black" >
        <i class=" me-2" style="background-color: aquamarine;"></i> Add Task
    </div>

    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <label class="form-label"> Title</label>
                <input type="text" class="form-control" id="name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Description</label>
                <input type="textarea" class="form-control" id="add">
            </div>
             <div class="col-md-6">
                <label class="form-label">Status</label>
              <select class="form-select" id="status">
        <option value="" selected disabled>Select Status</option>
        <option value="Todo">Todo</option>
        <option value="Progress">Progress</option>
        <option value="Completed">Completed</option>
    </select>

                
                
            </div>
             <div class="col-md-6">
                <label class="form-label">priority</label>
                <select class="form-select" id="priority">
                                <option value="" selected disabled>Select priority</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
</select>
               
            </div>
           
            <div class="col-md-6">
                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="date" >

               
            </div>
            <div class="col-md-12 text-center mt-3">
                              <button type="button" style="background-color: black;"
                                 class="btn btn-lg px-5 text-light" onclick="savetask()">
Submit                                </button>
                            </div>
        </div>
    </div>
</div>
</body>
<script>
      
function savetask(){

           var name= $('#name').val();
           var des= $('#add').val();  
           var status= $('#status').val();     
           var priority= $('#priority').val();  
          
            var enddate=$('#date').val()     
            $.ajax({
                type: 'POST',
                url: "{% url 'task_save' %}",
                data: {
               'name': name,
                    'des': des,
                    'status': status,
                    'priority':priority,
                    'enddate':enddate,
                   
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                
                success: function(r) {
                      if (r.success){
                        alert(r.message)
                        location.reload()
                    
                      }
                }
            });
          }

</script>
</html>
